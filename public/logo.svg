<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <!-- Andaman Dream Yatra Official Vector Logo -->
  <defs>
    <!-- Smooth drop shadows & filters if needed -->
    <filter id="logoSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <g id="logo-emblem">
    <!-- 1. GREEN PALM TREE & CIRCULAR ARC FRAME -->
    <!-- Palm Fronds (Leaves) -->
    <g id="palm-fronds" fill="#23773B">
      <!-- Leaf pointing top-left -->
      <path d="M120 180 C95 150 60 120 40 135 C30 142 55 160 85 175 C100 182 115 182 120 180 Z" />
      <!-- Leaf pointing far left-up -->
      <path d="M120 180 C80 170 30 165 15 185 C8 195 40 200 80 195 C100 192 115 186 120 180 Z" />
      <!-- Leaf pointing left-down -->
      <path d="M120 180 C85 200 35 220 20 240 C12 250 45 240 85 215 C105 202 116 188 120 180 Z" />
      <!-- Leaf pointing top-center -->
      <path d="M120 180 C110 135 105 85 125 70 C135 62 140 100 132 140 C128 160 124 175 120 180 Z" />
      <!-- Leaf pointing top-right-up -->
      <path d="M120 180 C135 140 165 95 190 105 C202 110 185 135 155 160 C138 172 126 178 120 180 Z" />
      <!-- Leaf pointing top-right -->
      <path d="M120 180 C150 165 205 150 225 170 C232 178 200 190 160 190 C138 190 125 184 120 180 Z" />
      <!-- Leaf pointing right-down -->
      <path d="M120 180 C145 195 195 215 205 235 C208 244 185 240 150 215 C132 202 123 188 120 180 Z" />
      <!-- Lower frond left -->
      <path d="M120 180 C95 220 60 255 45 270 C38 275 60 260 90 230 C108 212 118 192 120 180 Z" />
    </g>

    <!-- Palm Trunk curving into circular arc frame -->
    <!-- Starts at crown (120, 180), curves down as graceful trunk, then circles under and up right -->
    <path d="M124 180 C105 240 92 310 98 375 C105 440 150 495 220 515 C295 535 375 505 425 450 C470 400 485 320 460 250 C435 180 375 130 320 125 C310 124 315 132 325 135 C370 145 422 188 445 245 C468 305 452 380 410 425 C368 472 298 498 232 482 C168 466 128 418 122 360 C116 305 125 245 138 180 Z" 
          fill="#23773B" />

    <!-- 2. AIRPLANE AT THE TOP (Flying top-left) -->
    <g id="airplane" transform="translate(285, 110) rotate(-22)" fill="#422116">
      <!-- Fuselage -->
      <path d="M-40 0 C-30 -4 20 -4 40 -1 C45 0 45 2 40 3 C20 4 -30 4 -40 0 Z" />
      <!-- Wings -->
      <path d="M-5 -2 L-20 -28 C-22 -32 -18 -32 -14 -30 L10 -2 Z" />
      <path d="M-5 2 L-20 28 C-22 32 -18 32 -14 30 L10 2 Z" />
      <!-- Tail fin -->
      <path d="M-30 -1 L-44 -12 C-46 -14 -44 -15 -42 -14 L-32 0 Z" />
      <!-- Tail elevators -->
      <path d="M-32 0 L-42 12 C-44 14 -46 13 -44 11 L-30 1 Z" />
    </g>

    <!-- 3. TERRACOTTA SUN -->
    <circle cx="320" cy="210" r="23" fill="#BA6B41" />

    <!-- 4. CRUISE SHIP / CATAMARAN SILHOUETTE -->
    <g id="ship" fill="#422116">
      <!-- Top deck tier -->
      <path d="M255 272 C275 260 305 255 330 262 C334 263 325 275 315 276 C295 277 270 278 255 272 Z" />
      <!-- Middle deck tier / bridge -->
      <path d="M235 298 C265 278 315 272 350 285 C355 287 342 300 325 301 C295 303 260 304 235 298 Z" />
      <!-- Main deck & sleek wedge hull -->
      <path d="M205 332 C250 300 340 295 390 318 C400 322 375 358 350 365 C300 378 230 365 205 332 Z" />
    </g>

    <!-- 5. OCEAN WAVES SWOOSHES -->
    <!-- Upper Caramel Sand Wave -->
    <path d="M165 370 C200 435 295 440 375 395 C382 391 365 405 340 412 C275 428 200 420 165 370 Z" 
          fill="#BA7E52" />
    <!-- Lower Dark Chocolate Wave sweeping from left -->
    <path d="M85 410 C120 465 230 500 355 460 C368 456 345 470 315 478 C215 498 120 475 85 410 Z" 
          fill="#422116" />
  </g>

  <!-- 6. TYPOGRAPHY: Andaman Dream Yatra + Travel Made Simple -->
  <g id="logo-text" transform="translate(300, 545)">
    <!-- Andaman Dream Yatra in distinct bold warm styling -->
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Outfit', 'Georgia', serif" 
          font-weight="900" 
          font-size="39" 
          letter-spacing="0.5" 
          fill="#422116">
      Andaman Dream Yatra
    </text>

    <!-- Tagline: Travel Made Simple -->
    <text x="-165" y="24" 
          text-anchor="start" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-weight="700" 
          font-size="16" 
          letter-spacing="0.5" 
          fill="#23773B">
      Travel Made Simple
    </text>
  </g>
</svg>
